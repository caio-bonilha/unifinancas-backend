# Profile de desenvolvimento local: aponta o storage de documentos para o
# MinIO do docker-compose.yml. Ative com SPRING_PROFILES_ACTIVE=local
# (ou -Dspring-boot.run.profiles=local). NUNCA usar em producao.
unifinancas:
  storage:
    s3:
      endpoint-override: ${STORAGE_S3_ENDPOINT_OVERRIDE:http://localhost:9000}
      access-key: ${STORAGE_S3_ACCESS_KEY:minioadmin}
      secret-key: ${STORAGE_S3_SECRET_KEY:minioadmin}
